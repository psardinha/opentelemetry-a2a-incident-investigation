spring.application.name=string-utils-service
server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.observations.annotations.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Performance level
delay.average.to.reply.in.ms = 500
prob.generating.exceptions = 0.25

# Tracing
management.tracing.sampling.probability=1.0

# OpenTelemetry OTLP exporter
management.opentelemetry.tracing.export.otlp.endpoint=${LGTM_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

# Metrics -> LGTM
management.otlp.metrics.export.url=${LGTM_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
management.otlp.metrics.export.step=${METRICS_EXPORT_STEP:30s}

# Structured logging
# JSON logs to stdout.
# Grafana Alloy can collect these and forward them to Loki.
logging.structured.format.console=logstash

# Add service information to every log entry.
logging.structured.json.add.service.name=${spring.application.name}
logging.structured.json.add.service.version=${project.version:0.0.1-SNAPSHOT}